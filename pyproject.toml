[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passwatcher"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "platformdirs>=4,<5",
    "pyperclip>=1.9,<2",
    "tomli-w>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pyinstaller>=6,<7",
]

[project.scripts]
pw = "passwatcher.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
passwatcher = ["assets/passwatcher-server.pyz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
