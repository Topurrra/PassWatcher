name: Release Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<version> tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python and NSIS build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          choco install nsis --no-progress -y

      - name: Verify release version
        id: version
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              '${{ inputs.tag }}'
          } else {
              '${{ github.ref_name }}'
          }
          $version = python tools/verify_release_version.py $tag
          if ($LASTEXITCODE -ne 0) {
              throw 'Release version verification failed.'
          }
          $version = $version.Trim()
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=passwatcher-installer-$version" >> $env:GITHUB_OUTPUT

      - name: Build and test installer
        shell: pwsh
        run: ./tools/build_windows.ps1

      - name: Smoke-test install, upgrade, and uninstall
        shell: pwsh
        env:
          PASSWATCHER_SMOKE_ISOLATED_USER: '1'
        run: ./tests/setup/windows-installer-smoke.ps1 -Installer "dist/Passwatcher-Setup-*.exe"

      - name: Smoke-test destructive option boundaries
        shell: pwsh
        env:
          PASSWATCHER_SMOKE_ISOLATED_USER: '1'
          PASSWATCHER_SMOKE_DESTRUCTIVE_CANARIES: '1'
        run: ./tests/setup/windows-installer-safety-smoke.ps1 -Installer "dist/Passwatcher-Setup-*.exe"

      - name: Create release checksum
        id: assets
        shell: pwsh
        run: |
          $installers = @(Get-Item -Path "dist/Passwatcher-Setup-*.exe")
          if ($installers.Count -ne 1) {
              throw "Expected exactly one installer; found $($installers.Count)."
          }
          $expectedName = "Passwatcher-Setup-${{ steps.version.outputs.version }}.exe"
          if ($installers[0].Name -cne $expectedName) {
              throw "Expected $expectedName; found $($installers[0].Name)."
          }
          $checksumPath = $installers[0].FullName + '.sha256'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installers[0].FullName).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksumPath -Value "$hash  $($installers[0].Name)" -Encoding ascii

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            dist/Passwatcher-Setup-${{ steps.version.outputs.version }}.exe
            dist/Passwatcher-Setup-${{ steps.version.outputs.version }}.exe.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release-assets

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ needs.build.outputs.tag }}'
          $version = '${{ needs.build.outputs.version }}'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
              throw "Release $tag already exists; refusing to overwrite it."
          }
          $installers = @(Get-Item -Path 'release-assets/Passwatcher-Setup-*.exe')
          $checksums = @(Get-Item -Path 'release-assets/Passwatcher-Setup-*.exe.sha256')
          if ($installers.Count -ne 1 -or $checksums.Count -ne 1) {
              throw 'The downloaded artifact must contain exactly one installer and one checksum.'
          }
          gh release create $tag `
              $installers[0].FullName `
              $checksums[0].FullName `
              --repo '${{ github.repository }}' `
              --verify-tag `
              --generate-notes `
              --title "Passwatcher $version"
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
